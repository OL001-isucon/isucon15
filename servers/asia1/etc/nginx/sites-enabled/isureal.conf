# ルーターは asia2 へ転送しないので、ここから asia のアプリへ振り分ける
upstream isureal_app {
  # 同じ接続元は同じサーバーへ送る。不正アクセスの回数がサーバーごとに分散すると BAN されない
  # asia2 は DB も動いているので、DB を優先して少なめに流す
  hash $http_x_client_ip consistent;
  server 127.0.0.1:8080 weight=3 max_fails=3 fail_timeout=5s;
  server 192.168.4.10:8080 weight=1 max_fails=3 fail_timeout=5s;
  # 接続を毎回張らないように使い回す
  keepalive 128;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  # 通知は投稿期間が始まるまで応答が無いので、既定の 60 秒で切らない
  location = /api/notifications {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_pass http://isureal_app;
  }

  # 初期化は 1 か所で実行する
  location = /api/initialize {
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
    proxy_pass http://127.0.0.1:8080;
  }

  location /api/ {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://isureal_app;
  }

  # 画像の本体は Go が署名を検証したあと X-Accel-Redirect でここへ内部転送し、nginx が sendfile で返す。
  # ファイルが無ければ (配布が届く前など) X-Accel-Fallback を付けてアプリに本体を返させる
  location /internal-images/ {
    internal;
    alias /home/isucon/image-cache/;
    try_files $uri @image_fallback;
    # 読めないファイル (旧バイナリが 0600 で作った分) もアプリに任せる
    error_page 403 = @image_fallback;
  }

  location @image_fallback {
    rewrite ^ $request_uri break;
    proxy_set_header Host $host;
    proxy_set_header X-Accel-Fallback 1;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://isureal_app;
  }

  location / {
    try_files $uri /index.html;
  }
}
