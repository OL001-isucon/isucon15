# 既定の 128MB では posts (348MB) / realmojis (635MB) / image_meta (351MB) が収まらず、
# 毎回 OS のページキャッシュから読み直していた (asia2 の sys CPU 25〜49%、export のクエリが 70ms)。
# アプリ (約 300MB) とページキャッシュ (画像の控え) にメモリを残すため 512MB に留める
shared_buffers = 512MB
effective_cache_size = 2GB
# EBS (SSD) なので index の nested loop を選びやすくする。memories の RealMoji 取得が users を毎回 Seq Scan していた
random_page_cost = 1.1
