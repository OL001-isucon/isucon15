upstream isureal_app {
  server 127.0.0.1:8080;
  # 接続を毎回張らないように使い回す
  keepalive 128;
}

server {
  # 既定の 511 では走行中に溢れ、再送の 1 秒以上の遅れがログに出ないまま残る。上限は somaxconn の 10000
  listen 80 default_server backlog=10000;
  server_name _;

  client_max_body_size 32m;
  # 投稿の画像 (平均 354KB) を一時ファイルへ書かない。ディスクが詰まると nginx のワーカーごと止まる
  client_body_buffer_size 1m;
  root /home/isucon/webapp/public;

  # 通知は投稿期間が始まるまで応答が無いので、既定の 60 秒で切らない
  location = /api/notifications {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_pass http://isureal_app;
  }

  location /api/ {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://isureal_app;
  }

  location / {
    try_files $uri /index.html;
  }
}
